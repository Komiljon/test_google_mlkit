name: test_google_mlkit
description: "Google ML Kit"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4


##################
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Транзитивные зависимости `flutter_3d_ar_converter`; зафиксированы явно для ResolvingFaceARViewer.
  ar_flutter_plugin: ^0.7.3
  arkit_plugin: ^1.0.7
  # Вендор: апстрим не объявляет `plugin:` в pubspec → нет регистрации на iOS.
  flutter_3d_ar_converter:
    path: packages/flutter_3d_ar_converter
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.1
  vector_math: ^2.2.0
  permission_handler: ^10.4.5


####################
dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^6.0.0

####################
flutter:
  assets:
    - assets/glasses1.png
    - assets/glasses2.png
    - assets/glasses3.png
    - assets/sunglasses_lenses.glb