name: test_google_mlkit
description: "Google ML Kit"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4


##################
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8    
  # Major 0.12.x доступен; перед обновлением см. changelog пакета camera (интерфейсы Android/iOS).
  camera: ^0.11.3
  camera_android: ^0.10.10+14
  camera_avfoundation: ^0.9.23
  google_mlkit_face_detection: ^0.13.2
  # Явная версия для воспроизводимых сборок (совместимо с google_mlkit_face_detection 0.13.x).
  google_mlkit_commons: ^0.11.1
  # Декод + bakeOrientation(EXIF) — выровнять пиксели для ML Kit и Flutter decodeImageFromList.
  image: ^4.5.4
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.1
  vector_math: ^2.2.0
  flutter_3d_controller: ^2.2.0


####################
dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^6.0.0

####################
flutter:
  assets:
    - assets/glasses1.png
    - assets/glasses2.png
    - assets/glasses3.png
    - assets/sunglasses.glb
    - assets/sunglasses_lenses.glb
