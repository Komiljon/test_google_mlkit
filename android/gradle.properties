org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Проект на одном диске (например G:\), pub-кэш плагинов на другом (C:\) — Kotlin IC не может
# посчитать относительные пути между корнями; даёт "different roots" и падение daemon.
# См. обсуждения Kotlin/Gradle на Windows с symlink и multi-root.
kotlin.incremental=false
